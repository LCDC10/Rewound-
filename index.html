<script>
"use strict";

/* ===================== date helpers (timezone-safe, string-based) ===================== */

function todayISO(){
  if (window.__TEST_TODAY) return window.__TEST_TODAY;       // test hook
  const n = new Date();
  return n.getFullYear() + "-" + String(n.getMonth()+1).padStart(2,"0") + "-" + String(n.getDate()).padStart(2,"0");
}
function addDaysISO(iso, n){
  const [y,m,dd] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, dd + n, 12)).toISOString().slice(0,10);
}
function diffDays(a, b){
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 864e5);
}
function prettyDate(iso){
  const [y,m,dd] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, dd, 12)).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric",timeZone:"UTC"});
}
function computeSimToday(anchor, today){
  let sim = addDaysISO(anchor.simStart, diffDays(anchor.realStart, today));
  if (sim > today) sim = today;   // can't outrun the present
  return sim;
}

/* ===================== misc helpers ===================== */

function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function rnd(seed){ return (hash(seed)%1000)/1000; }
function fmt(n){ return n.toLocaleString("en-US"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const CH = (window.CORPUS && window.CORPUS.channels) || [];
function chOf(key){ return CH.find(c => c.key === key); }
function chOfVideo(vid){ return CH.find(c => c.videos.some(v => v.id === vid)); }
function findVideo(id){ for (const c of CH){ const v = c.videos.find(x => x.id === id); if (v) return v; } return null; }
function firstUpload(ch){ return ch.videos.map(v => v.date).sort()[0]; }
function firstSurviving(ch){ const s = ch.videos.filter(v => !v.gone).map(v => v.date).sort(); return s[0] || firstUpload(ch); }

/* est. view count back-simulated from today's total (deterministic, labeled as estimate in UI) */
function simViews(v, simDate){
  if (v.gone || !v.nowViews) return 0;
  const total = diffDays(v.date, todayISO());
  const elapsed = diffDays(v.date, simDate);
  if (elapsed < 0) return 0;
  const t = total > 0 ? elapsed / total : 1;
  const f = 1 - Math.exp(-2.6 * t);
  const views = Math.round(v.nowViews * f * (0.85 + rnd(v.id) * 0.3));
  return Math.max(Math.min(views, v.nowViews), Math.round(80 + rnd(v.id+"f") * 400));
}
function subsAt(ch, simDate){
  if (!ch.subsNow) return null;
  const start = firstUpload(ch);
  const total = diffDays(start, todayISO()), elapsed = diffDays(start, simDate);
  if (elapsed < 0 || total <= 0) return 0;
  const t = Math.min(1, elapsed / total);
  return Math.round(ch.subsNow * Math.pow(t, ch.subsExp || 1.5)) + 1;
}
function agoText(pub, simDate){
  const days = diffDays(pub, simDate);
  if (days <= 0) return "today";
  if (days === 1) return "1 day ago";
  if (days < 7) return days + " days ago";
  if (days < 31) return Math.floor(days/7) + (days < 14 ? " week ago" : " weeks ago");
  if (days < 365) return Math.floor(days/30) + (days < 60 ? " month ago" : " months ago");
  const y = Math.floor(days/365);
  return y + (y === 1 ? " year ago" : " years ago");
}

/* ===================== persistence ===================== */

const LS_ANCHOR = "rewound.anchor", LS_VISIT = "rewound.lastVisit", LS_NAME = "rewound.name";

function loadAnchor(){
  try { const a = JSON.parse(localStorage.getItem(LS_ANCHOR)); if (a && a.subs && a.simStart && a.realStart) return a; } catch {}
  return null;
}
function saveAnchor(a){ try { localStorage.setItem(LS_ANCHOR, JSON.stringify(a)); } catch {} }
function loadVisit(){ try { return JSON.parse(localStorage.getItem(LS_VISIT)); } catch { return null; } }
function saveVisit(v){ try { localStorage.setItem(LS_VISIT, JSON.stringify(v)); } catch {} }

function importFromHash(){
  if (!location.hash.startsWith("#save=")) return false;
  try {
    const a = JSON.parse(decodeURIComponent(location.hash.slice(6)));
    if (a && a.subs && a.simStart && a.realStart) {
      saveAnchor(a);
      history.replaceState(null, "", location.pathname + location.search);
      return true;
    }
  } catch {}
  return false;
}
function saveLink(){
  return location.origin + location.pathname + "#save=" + encodeURIComponent(JSON.stringify(S.anchor));
}
function copySaveLink(){
  const url = saveLink();
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(() => alert("Save link copied! Open it on any device to continue this timeline."));
  } else { prompt("Copy your save link:", url); }
}
function inviteLink(){
  return location.origin + location.pathname + "#g=" + S.anchor.groupId;
}
function copyInvite(){
  const url = inviteLink();
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(() => alert("Invite link copied! Anyone who opens it joins this timeline."));
  } else { prompt("Copy the invite link:", url); }
}

/* ===================== community backend (Supabase, optional) ===================== */

const CFG = window.REWOUND_CONFIG || {};
const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey)
  : null;

async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) return true;
  const { error } = await sb.auth.signInAnonymously();
  if (error) { alert("Couldn't start a session: " + error.message); return false; }
  return true;
}
function travelerName(){
  let name = "";
  try { name = localStorage.getItem(LS_NAME) || ""; } catch {}
  if (!name) {
    name = (prompt("Pick a traveler name (shown with your comments):") || "").trim().slice(0, 30);
    if (name.length < 2) return null;
    try { localStorage.setItem(LS_NAME, name); } catch {}
  }
  return name;
}

/* ---------- comments ---------- */

async function hydrateComments(vid){
  const zone = document.getElementById("cmtZone");
  if (!zone) return;
  if (!sb) {
    zone.innerHTML = `<div class="nocmt">Community comments are switched off in this deployment. They're free to enable — see the README.</div>`;
    return;
  }
  zone.innerHTML = `<div class="nocmt">Listening for voices from your timeline…</div>`;
  try {
    const { data: list, error } = await sb.from("comments")
      .select("id,author_name,body,sim_date,group_id")
      .eq("video_id", vid).lte("sim_date", S.simToday)
      .order("sim_date", { ascending: false }).limit(100);
    if (error) throw error;
    const { count } = await sb.from("comments")
      .select("id", { count: "exact", head: true })
      .eq("video_id", vid).gt("sim_date", S.simToday);
    const items = (list && list.length)
      ? list.map(c => `<div class="cmt"><span class="rep" onclick="reportComment('${c.id}')" title="Report">⚑ report</span><span class="u">${esc(c.author_name)}</span>${c.group_id && S.anchor && c.group_id === S.anchor.groupId ? '<span class="gbadge">your group</span>' : ""}<span class="when">on ${prettyDate(c.sim_date)}</span><br>${esc(c.body)}</div>`).join("")
      : `<div class="nocmt">No traveler has commented this far back. Leave the first note.</div>`;
    const future = count ? `<div class="future">🔭 ${count} comment${count===1?"":"s"} from travelers further down your timeline — keep going to read ${count===1?"it":"them"}.</div>` : "";
    zone.innerHTML = items + future + `
      <div class="cmtbox"><input type="text" id="cmtInput" maxlength="500" placeholder="Leave a note for travelers behind you — it's ${esc(prettyDate(S.simToday))}" onkeydown="if(event.key==='Enter')submitComment('${vid}')">
      <button class="btn" onclick="submitComment('${vid}')">Post</button></div>
      <div class="cmthint">Comments are stamped with your simulated date. Travelers only see notes from at or before their own date — no spoilers given, none received.</div>`;
  } catch (e) {
    zone.innerHTML = `<div class="nocmt">Couldn't reach the comment service right now.</div>`;
  }
}
async function submitComment(vid){
  const box = document.getElementById("cmtInput");
  const body = (box && box.value || "").trim();
  if (!body || !sb) return;
  const name = travelerName();
  if (!name) return;
  if (!await ensureSession()) return;
  const { error } = await sb.from("comments").insert({
    video_id: vid, body: body.slice(0,500), sim_date: S.simToday,
    author_name: name, group_id: (S.anchor && S.anchor.groupId) || null
  });
  if (error) { alert("Couldn't post: " + (error.message.includes("row-level") ? "slow down a little (rate limit)." : error.message)); return; }
  hydrateComments(vid);
}
async function reportComment(id){
  if (!sb || !confirm("Report this comment to the moderators?")) return;
  if (!await ensureSession()) return;
  await sb.from("reports").insert({ comment_id: id });
  alert("Thanks. Comments are hidden automatically after multiple reports.");
}

/* ---------- groups / events ---------- */

function anchorFromGroup(g){
  return {
    v: 1,
    subs: (Array.isArray(g.subs) ? g.subs : []).filter(k => chOf(k)),
    zeroSim: g.zero_sim, simStart: g.zero_sim, realStart: g.real_start,
    groupId: g.id, groupName: g.name, pace: g.pace === "free" ? "free" : "locked"
  };
}
async function loadGroup(code){
  if (!sb) { S.joinError = "This deployment has the community backend switched off, so event links can't be looked up here."; render(); return; }
  try {
    const { data, error } = await sb.from("groups").select("*").eq("id", code).single();
    if (error || !data) throw error || new Error("not found");
    S.groupData = data;
    try { const { data: n } = await sb.rpc("group_member_count", { gid: code }); if (typeof n === "number" || typeof n === "string") S.groupCount = Number(n); } catch {}
  } catch (e) {
    S.joinError = "Event not found — the link may be wrong, or the event was removed.";
  }
  render();
}
async function joinGroup(){
  const g = S.groupData;
  if (!g) return;
  if (S.anchor && !confirm("Joining replaces your current timeline. (Your old save link can restore it later.) Continue?")) return;
  if (!await ensureSession()) return;
  const a = anchorFromGroup(g);
  if (!a.subs.length) { alert("None of this event's channels exist on this site's corpus."); return; }
  try { await sb.from("group_members").upsert({ group_id: g.id }, { onConflict: "group_id,member_id", ignoreDuplicates: true }); } catch {}
  S.anchor = a; saveAnchor(a);
  history.replaceState(null, "", location.pathname + location.search);
  refreshClock(false);
  saveVisit({ real: todayISO(), sim: S.simToday });
  S.banner = null; S.groupData = null; S.joinError = null; S.page = "home";
  render();
}
function leaveGroup(){
  if (!confirm(`Leave "${S.anchor.groupName}"? You keep your place and continue as a personal timeline.`)) return;
  delete S.anchor.groupId; delete S.anchor.groupName; delete S.anchor.pace;
  saveAnchor(S.anchor); render();
}
async function fillGroupCount(){
  if (!sb || !S.anchor || !S.anchor.groupId) return;
  const el = document.getElementById("mcount");
  if (!el) return;
  try {
    const { data: n } = await sb.rpc("group_member_count", { gid: S.anchor.groupId });
    el.textContent = fmt(Number(n));
  } catch { el.textContent = "?"; }
}

/* ===================== state ===================== */

const S = { page:"setup", anchor:null, simToday:null, channelKey:null, watchId:null, from:"home", q:"", banner:null,
            joinCode:null, joinError:null, groupData:null, groupCount:null };

function subbed(){ return CH.filter(c => S.anchor && S.anchor.subs.includes(c.key)); }
function subVideos(upTo){
  const out = [];
  for (const c of subbed()) for (const v of c.videos) if (v.date <= upTo) out.push({ ...v, _ch:c });
  return out.sort((a,b) => a.date < b.date ? 1 : -1);
}
function allVideos(upTo){
  const out = [];
  for (const c of CH) for (const v of c.videos) if (v.date <= upTo && !v.gone) out.push({ ...v, _ch:c });
  return out;
}

/* ===================== boot ===================== */

function boot(){
  const g = location.hash.match(/^#g=([A-Za-z0-9]+)$/);
  if (g) { S.page = "join"; S.joinCode = g[1]; render(); loadGroup(g[1]); return; }
  importFromHash();
  S.anchor = loadAnchor();
  if (!S.anchor) { S.page = "setup"; render(); return; }
  refreshClock(true);
  S.page = "home";
  render();
}
function refreshClock(checkCatchUp){
  const today = todayISO();
  S.simToday = computeSimToday(S.anchor, today);
  if (checkCatchUp) {
    const visit = loadVisit();
    if (visit && visit.real < today && visit.sim < S.simToday) {
      const missed = subVideos(S.simToday).filter(v => v.date > visit.sim && !v.gone);
      if (missed.length) S.banner = { count: missed.length, since: visit.sim, days: diffDays(visit.sim, S.simToday) };
    }
    saveVisit({ real: today, sim: S.simToday });
  }
}

/* ===================== actions ===================== */

async function beginTimeline(){
  const picked = [...document.querySelectorAll(".chk")].filter(c => c.checked).map(c => c.dataset.key);
  if (!picked.length) { alert("Pick at least one channel to follow."); return; }
  const day0 = document.getElementById("startDate").value;
  if (!day0) { alert("Pick a starting date."); return; }

  const grpChk = document.getElementById("grpChk");
  if (grpChk && grpChk.checked) {
    const name = (document.getElementById("grpName").value || "").trim();
    const pace = document.getElementById("grpPace").value === "free" ? "free" : "locked";
    if (name.length < 2) { alert("Give the event a name."); return; }
    if (!await ensureSession()) return;
    const { data, error } = await sb.from("groups")
      .insert({ name: name.slice(0,60), pace, subs: picked, zero_sim: day0, real_start: todayISO() })
      .select().single();
    if (error) { alert("Couldn't create the event: " + error.message); return; }
    try { await sb.from("group_members").upsert({ group_id: data.id }, { onConflict: "group_id,member_id", ignoreDuplicates: true }); } catch {}
    S.anchor = anchorFromGroup(data);
  } else {
    S.anchor = { v:1, subs:picked, zeroSim:day0, simStart:day0, realStart:todayISO() };
  }

  saveAnchor(S.anchor);
  saveVisit({ real: todayISO(), sim: day0 });
  S.simToday = day0; S.banner = null; S.page = "home";
  render();
  if (S.anchor.groupId) setTimeout(() => {
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(inviteLink()).then(() => alert("Event created — invite link copied to your clipboard!\n\n" + inviteLink()));
    } else { prompt("Event created! Share this invite link:", inviteLink()); }
  }, 60);
}
function filterChannels(q){
  q = (q || "").trim().toLowerCase();
  document.querySelectorAll("#chList .chrow").forEach(r => {
    r.style.display = !q || (r.dataset.name || "").includes(q) ? "flex" : "none";
  });
}
function updateSelCount(){
  const el = document.getElementById("selCount");
  if (el) el.textContent = [...document.querySelectorAll(".chk")].filter(c => c.checked).length;
}
function clearChecks(){
  document.querySelectorAll(".chk").forEach(c => { c.checked = false; });
  updateSelCount();
}
function toggleGroupOpts(chk){ const o = document.getElementById("grpOpts"); if (o) o.style.display = chk.checked ? "flex" : "none"; }
function quickDate(v){ document.getElementById("startDate").value = v; }
function ffwd(days){
  if (S.anchor.groupId) {
    if (S.anchor.pace === "locked") { alert("This is a locked event — everyone moves together, one day per day."); return; }
    if (!confirm(`Fast-forwarding leaves "${S.anchor.groupName}" — you'll continue alone from wherever you land. Continue?`)) return;
    delete S.anchor.groupId; delete S.anchor.groupName; delete S.anchor.pace;
  }
  S.anchor.simStart = addDaysISO(S.anchor.simStart, days);
  saveAnchor(S.anchor); refreshClock(false);
  saveVisit({ real: todayISO(), sim: S.simToday });
  render();
}
function ffwdNextUpload(){
  const future = subbed().flatMap(c => c.videos.filter(v => !v.gone).map(v => v.date)).filter(dt => dt > S.simToday).sort();
  if (!future.length) { alert("No more uploads ahead in your subscriptions."); return; }
  ffwd(diffDays(S.simToday, future[0]));
}
function goHome(){ S.page = S.anchor ? "home" : "setup"; S.channelKey = null; S.q = ""; render(); }
function openChannel(key){ S.page="channel"; S.channelKey=key; S.q=""; render(); window.scrollTo(0,0); }
function openVideo(id){ const v = findVideo(id); if (!v || v.gone) return; S.from = S.page; S.watchId = id; S.page = "watch"; render(); window.scrollTo(0,0); }
function goBack(){ S.page = (S.from === "channel" && S.channelKey) ? "channel" : "home"; S.watchId = null; render(); }
function toggleSub(key){
  const i = S.anchor.subs.indexOf(key);
  if (i >= 0) S.anchor.subs.splice(i, 1); else S.anchor.subs.push(key);
  saveAnchor(S.anchor); render();
}
function dismissBanner(){ S.banner = null; render(); }
function resetTimeline(){
  if (!confirm("End this timeline and start over? Your save link can restore it later.")) return;
  localStorage.removeItem(LS_ANCHOR); localStorage.removeItem(LS_VISIT);
  S.anchor = null; S.page = "setup"; render();
}
function setQ(val){ S.q = val.toLowerCase(); renderInto(); }

/* ===================== rendering ===================== */

function avStyle(c){ return `background:linear-gradient(135deg,${c.c1||"#555"},${c.c2||"#222"})`; }
function avatarHtml(c, cls){
  if (c.avatarUrl) return `<div class="av ${cls||""}"><img loading="lazy" src="${esc(c.avatarUrl)}" alt=""></div>`;
  return `<div class="av ${cls||""}" style="${avStyle(c)}">${c.avatar || "📺"}</div>`;
}
function thumbHtml(v, ch){
  if (v.gone) return `<div class="thumb-gone"><span class="x">✖</span>no longer available</div>`;
  if (ch.real) return `<div class="thumb" onclick="openVideo('${v.id}')"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""></div>`;
  return `<div class="thumb" onclick="openVideo('${v.id}')"><div class="thumb-ph" style="${avStyle(ch)}">${v.e || "🎬"}</div></div>`;
}
function vrow(v, ch, showCh){
  if (v.gone) return `<div class="vrow">${thumbHtml(v, ch)}
    <div class="vinfo"><span class="t gone">${esc(v.title)}</span>
    <div class="m">uploaded ${agoText(v.date, S.simToday)} · this video has since been deleted — part of lost internet history</div></div></div>`;
  const isNew = v.date === S.simToday;
  const by = showCh ? `<a href="#" onclick="openChannel('${ch.key}');return false;">${esc(ch.name)}</a>` : esc(ch.real && v.by ? v.by : ch.name);
  return `<div class="vrow">${thumbHtml(v, ch)}
    <div class="vinfo">
      <a href="#" class="t" onclick="openVideo('${v.id}');return false;">${esc(v.title)}</a>${isNew ? '<span class="newbadge">NEW</span>' : ""}
      <div class="m">by ${by} · ≈${fmt(simViews(v, S.simToday))} views (est.) · uploaded ${agoText(v.date, S.simToday)}</div>
      <div class="d">${esc(v.desc || "")}</div>
    </div></div>`;
}

function header(){
  return `<div id="hdr"><div class="wrap">
    <div class="logo" onclick="goHome()"><span class="arrow">⏪</span> <span class="rw">Rewound</span><span class="tag">watch the internet like it's then</span></div>
    <div class="searchbox"><input id="q" placeholder="Search your timeline" value="${esc(S.q)}" oninput="setQ(this.value)"><button>Search</button></div>
  </div></div>`;
}
function timebar(){
  if (S.page === "setup" || S.page === "join") return "";
  const dayN = diffDays(S.anchor.zeroSim || S.anchor.simStart, S.simToday) + 1;
  const grp = S.anchor.groupId ? `<span class="grouptag">👥 ${esc(S.anchor.groupName)}${S.anchor.pace === "locked" ? " · 🔒" : ""}</span>` : "";
  const controls = (S.anchor.groupId && S.anchor.pace === "locked")
    ? `<span class="ffwd"><span class="lbl">locked event pace — everyone moves together</span></span>`
    : `<span class="ffwd"><span class="lbl">fast-forward (permanent):</span>
        <button class="btn" onclick="ffwd(1)">+1 day</button>
        <button class="btn" onclick="ffwd(7)">+1 week</button>
        <button class="btn" onclick="ffwdNextUpload()">⏭ next upload</button>
      </span>`;
  return `<div id="timebar"><div class="wrap">
    <span class="today">📅 It's ${prettyDate(S.simToday)}</span>
    ${grp}
    <span class="dayn">day ${fmt(dayN)} of ${S.anchor.groupId ? "the event" : "your timeline"} · advances daily with the real world</span>
    ${controls}
  </div></div>`;
}

function setupPage(){
  const sorted = [...CH].sort((a,b) => a.name.localeCompare(b.name));
  const rows = sorted.map(c => `
    <label class="chrow" data-name="${esc(c.name.toLowerCase())}">
      <input type="checkbox" class="chk" data-key="${c.key}" onchange="updateSelCount()">
      ${avatarHtml(c)}
      <span><span class="nm">${esc(c.name)}</span><span class="pill ${c.sample ? "sample" : "real"}">${c.sample ? "SAMPLE" : "REAL"}</span>
      <div class="meta">first upload ${prettyDate(firstUpload(c))}${firstSurviving(c) !== firstUpload(c) ? " · survives from " + prettyDate(firstSurviving(c)) : ""}</div></span>
    </label>`).join("");
  const dayOneOpts = sorted.map(c => `<option value="${firstSurviving(c)}">${esc(c.name)} — ${prettyDate(firstSurviving(c))}</option>`).join("");
  const groupSection = sb ? `
    <div class="steph">3. Optional: make it a group event</div>
    <div class="grouprow">
      <label><input type="checkbox" id="grpChk" onchange="toggleGroupOpts(this)"> Create a shared timeline others can join with a link</label>
      <span id="grpOpts" style="display:none;gap:8px;align-items:center;flex-wrap:wrap">

        <select id="grpPace">
          <option value="locked">🔒 Locked pace — everyone moves together</option>
          <option value="free">🕊️ Free pace — fast-forward forks you off</option>
        </select>
      </span>
    </div>` : "";
  return `<div id="setup" class="wrap">
    <div class="logo biglogo"><span class="arrow">⏪</span> <span class="rw">Rewound</span></div>
    <div class="tagline">Subscribe like it's day one. Time moves forward one real day at a time.</div>
    <div class="steph">1. Pick your subscriptions <span style="color:#999;font-weight:normal;font-size:11px">(${CH.length} channels)</span></div>
    <div class="chsearch"><input id="chFilter" placeholder="Search channels…" oninput="filterChannels(this.value)"></div>
    <div class="chlist" id="chList">${rows}</div>
    <div class="selcount"><b><span id="selCount">0</span></b> selected · <a href="#" onclick="clearChecks();return false;">clear</a></div>
    <div class="steph">2. Pick your day zero</div>
    <div class="daterow">
      <input type="date" id="startDate" value="2010-10-02" min="2005-04-23" max="${todayISO()}">
      <select onchange="if(this.value){quickDate(this.value);this.selectedIndex=0;}">
        <option value="">Jump to a channel's day one…</option>
        ${dayOneOpts}
      </select>
      <button class="btn" onclick="quickDate('2005-04-23')">YouTube's first video</button>
    </div>
    ${groupSection}
    <div style="margin-top:26px"><button class="btn btn-go" onclick="beginTimeline()">⏰ Begin</button></div>
    <div class="note">Calendar mode: open Rewound tomorrow and it's the next day there too — skip a day, you skip a day there.<br>
    Comments from other travelers are gated by date: you only see notes written at or before your own day. No spoilers.<br>
    Not affiliated with YouTube.</div>
  </div>`;
}

function joinPage(){
  const logo = `<div class="logo biglogo"><span class="arrow">⏪</span> <span class="rw">Rewound</span></div>`;
  if (S.joinError) return `<div id="setup" class="wrap">${logo}
    <div class="empty">${esc(S.joinError)}</div>
    <p><a href="${location.pathname}">Start your own timeline →</a></p></div>`;
  if (!S.groupData) return `<div id="setup" class="wrap">${logo}<div class="empty">Looking up the event…</div></div>`;
  const g = S.groupData;
  const a = anchorFromGroup(g);
  const sim = computeSimToday(a, todayISO());
  const dayN = diffDays(g.zero_sim, sim) + 1;
  const chips = a.subs.map(k => esc(chOf(k).name)).join(", ") || "—";
  return `<div id="setup" class="wrap">${logo}
    <div class="joinbox">
      <h2>👥 ${esc(g.name)}</h2>
      <p>You've been invited to a shared timeline. Day zero is <b>${prettyDate(g.zero_sim)}</b>, and the group is currently on <b>day ${fmt(dayN)} — ${prettyDate(sim)}</b>. Joining puts you exactly in step with everyone else.</p>
      <p><b>Channels:</b> ${chips}</p>
      <p>${g.pace === "free"
        ? "🕊️ <b>Free pace</b> — you may fast-forward, which forks you onto your own branch."
        : "🔒 <b>Locked pace</b> — no fast-forward; everyone experiences each day together."}</p>
      <p><b>${S.groupCount !== null ? fmt(S.groupCount) : "…"}</b> traveler${S.groupCount === 1 ? "" : "s"} so far.</p>
      <p style="margin-top:14px"><button class="btn btn-go" onclick="joinGroup()">Join this timeline</button></p>
      <p><a href="${location.pathname}">No thanks — start my own →</a></p>

}

function bannerHtml(){
  if (!S.banner) return "";
  return `<div id="banner">⏪ <b>While you were away</b> — ${S.banner.days} day${S.banner.days===1?"":"s"} passed: ${S.banner.count} new upload${S.banner.count===1?"":"s"} from your subscriptions since ${prettyDate(S.banner.since)}.
    <span class="x" onclick="dismissBanner()">✕ dismiss</span></div>`;
}

function homePage(){
  const todayVids = subVideos(S.simToday).filter(v => v.date === S.simToday);
  let recent = subVideos(S.simToday).filter(v => v.date !== S.simToday).slice(0, 10);
  if (S.q) recent = recent.filter(v => v.title.toLowerCase().includes(S.q));
  const popular = allVideos(S.simToday).map(v => ({ ...v, sv: simViews(v, S.simToday) }))
    .sort((a,b) => b.sv - a.sv).slice(0, 6);
  const future = subbed().flatMap(c => c.videos.filter(v => !v.gone).map(v => ({ d:v.date, n:c.name }))).filter(x => x.d > S.simToday).sort((a,b) => a.d < b.d ? -1 : 1);
  const ffNote = (S.anchor.groupId && S.anchor.pace === "locked") ? "" : " — or fast-forward to it";
  const nextHint = future.length ? `<div class="hint">⏳ Next upload from your subscriptions: <b>${esc(future[0].n)}</b> in ${diffDays(S.simToday, future[0].d)} day${diffDays(S.simToday, future[0].d)===1?"":"s"}${ffNote}.</div>` : "";

  const newSec = todayVids.length
    ? todayVids.map(v => vrow(v, v._ch, true)).join("")
    : `<div class="empty">No uploads from your subscriptions today.</div>${nextHint}`;

  const channels = subbed().map(c => {
    const started = firstUpload(c) <= S.simToday;
    return `<div class="chiprow" onclick="openChannel('${c.key}')">${avatarHtml(c)}
      <span class="nm">${esc(c.name)}</span>
      <span class="st">${started ? "✓" : "not yet…"}</span></div>`;
  }).join("");
  const discover = CH.filter(c => !S.anchor.subs.includes(c.key)).slice(0, 6).map(c =>
    `<div class="chiprow" onclick="openChannel('${c.key}')">${avatarHtml(c)}<span class="nm">${esc(c.name)}</span></div>`).join("");

  const groupBox = S.anchor.groupId ? `
    <div class="sidebox"><h4>👥 ${esc(S.anchor.groupName)}</h4>
      <p>${S.anchor.pace === "locked" ? "🔒 Locked pace — the whole group moves together, one day per day." : "🕊️ Free pace — fast-forwarding forks you onto your own branch."}</p>
      <p><b><span id="mcount">…</span></b> traveler(s) on this timeline.</p>
      <p><button class="btn" onclick="copyInvite()">📨 Copy invite link</button></p>
      <p><a href="#" onclick="leaveGroup();return false;">Leave event (keep my place)</a></p>
    </div>` : "";

  return `<div class="wrap">${bannerHtml()}
    <div class="cols">
      <div class="main">
        <div class="sec"><h3>New from your subscriptions — ${prettyDate(S.simToday)}</h3>${newSec}</div>
        <div class="sec"><h3>Recent uploads</h3>${recent.map(v => vrow(v, v._ch, true)).join("") || '<div class="empty">Nothing yet — your channels haven\'t started uploading.</div>'}</div>
        <div class="sec"><h3>Popular right now</h3>${popular.map(v => vrow(v, v._ch, true)).join("")}</div>
      </div>
      <div class="side">
        ${groupBox}
        <div class="sidebox"><h4>Your subscriptions</h4>${channels || '<p>None yet.</p>'}</div>
        <div class="sidebox"><h4>Discover</h4>${discover || '<p>You follow everything!</p>'}</div>
        <div class="sidebox"><h4>Your timeline</h4>
          <p>Started ${prettyDate(S.anchor.zeroSim || S.anchor.simStart)} · calendar mode.</p>
          <p><button class="btn" onclick="copySaveLink()">📎 Copy save link</button></p>
          <p>The save link restores this timeline on any device or browser.</p>
          <p><a href="#" onclick="resetTimeline();return false;">End timeline &amp; start over</a></p>
        </div>
        <div class="sidebox"><h4>About the numbers</h4>
          <p>View and subscriber counts are <b>estimates</b>, back-simulated for the date you're visiting. Real videos play in YouTube's official player.</p>
        </div>
      </div>
    </div>
  </div>`;
}

function channelPage(){
  const c = chOf(S.channelKey);
  if (!c) return `<div class="wrap empty">Channel not found.</div>`;
  let vids = c.videos.filter(v => v.date <= S.simToday).sort((a,b) => a.date < b.date ? 1 : -1);
  if (S.q) vids = vids.filter(v => v.title.toLowerCase().includes(S.q));
  const started = firstUpload(c) <= S.simToday;
  const isSub = S.anchor.subs.includes(c.key);
  const subs = subsAt(c, S.simToday);
  const lost = c.videos.filter(v => v.gone && v.date <= S.simToday).length;
  return `<div class="wrap">
    <div style="font-size:11px;padding-top:10px"><a href="#" onclick="goHome();return false;">« Home</a></div>
    <div class="chhead">${avatarHtml(c)}
      <div><h2>${esc(c.name)}</h2>
      <div class="stats">${started ? `${subs ? "≈" + fmt(subs) + " subscribers (est.) · " : ""}${vids.filter(v=>!v.gone).length} videos${lost ? ` · ${lost} lost to time` : ""}` : `Doesn't exist yet — first upload ${prettyDate(firstUpload(c))}`}</div></div>
      <span style="margin-left:auto"><button class="btn btn-sub ${isSub ? "on" : ""}" onclick="toggleSub('${c.key}')">${isSub ? "✓ Subscribed" : "Subscribe"}</button></span>
    </div>
    ${c.sample ? `<div class="sampletag">ℹ️ Sample data. Run the "Refresh corpus" GitHub Action with your API key to replace this with the channel's real uploads.</div>` : ""}
    ${vids.length ? vids.map(v => vrow(v, c, false)).join("") : `<div class="empty">${started ? "No uploads match." : "Come back when their first video drops."}</div>`}
  </div>`;
}

function watchPage(){
  const v = findVideo(S.watchId), ch = chOfVideo(S.watchId);
  if (!v || !ch) return `<div class="wrap empty">Video not found.</div>`;
  const views = simViews(v, S.simToday);
  const likes = Math.round(views * (0.006 + rnd(v.id+"l") * 0.006));
  const dislikes = Math.round(likes * (0.03 + rnd(v.id+"d") * 0.05));
  const pct = likes + dislikes ? Math.round(likes / (likes + dislikes) * 100) : 100;
  let player;
  if (v.gone) {
    player = `<div class="player"><div class="ph gone"><span class="e">✖</span><span>This video is no longer available.<br>It was deleted at some point between then and now.</span></div></div>`;
  } else if (ch.sample) {
    player = `<div class="player"><div class="ph" style="${avStyle(ch)}"><span class="e">${v.e || "🎬"}</span><span>Sample video — real corpus embeds the actual upload here</span></div></div>`;
  } else if (v.embeddable === false) {
    player = `<div class="player"><div class="ph" style="background:#181818"><span class="e">▶️</span><span>The uploader disabled embedding for this video.</span>
      <a class="btn" style="color:#000" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Watch on YouTube</a></span></div></div>`;
  } else {
    player = `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}" allowfullscreen title="${esc(v.title)}"></iframe></div>
      <div style="font-size:11px;color:#999;margin-top:4px">Player not loading? <a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Open on YouTube</a>.</div>`;
  }
  const related = subVideos(S.simToday).filter(x => x.id !== v.id && !x.gone)
    .sort((a,b) => (a._ch.key === ch.key ? -1 : 0) - (b._ch.key === ch.key ? -1 : 0)).slice(0, 7)
    .map(x => `<div class="srow">${thumbHtml(x, x._ch)}
      <div><a href="#" class="t" onclick="openVideo('${x.id}');return false;">${esc(x.title)}</a>
      <div class="m">≈${fmt(simViews(x, S.simToday))} views (est.)</div></div></div>`).join("");
  return `<div class="wrap">
    <div style="font-size:11px;padding-top:10px"><a href="#" onclick="goBack();return false;">« Back</a></div>
    <div class="watch">
      <div class="wmain">
        <h1>${esc(v.title)}</h1>
        <div style="font-size:12px;color:#666;margin-bottom:7px">by <a href="#" onclick="openChannel('${ch.key}');return false;"><b>${esc(ch.real && v.by ? v.by : ch.name)}</b></a> · uploaded ${agoText(v.date, S.simToday)}</div>
        ${player}
        <div class="statrow">
          <span class="views">≈${fmt(views)} views <span class="est">(est. for ${prettyDate(S.simToday)})</span></span>
          <span><div class="ratebar"><div style="width:${pct}%"></div></div>
          <div class="ratenums">👍 ≈${fmt(likes)} &nbsp; 👎 ≈${fmt(dislikes)} &nbsp; (est.)</div></span>
        </div>
        <div class="descbox"><b>Uploaded ${prettyDate(v.date)}</b><br>${esc(v.desc || "")}</div>
        <div class="comments"><h3>Comments from fellow travelers</h3><div id="cmtZone"></div></div>
      </div>
      <div class="sidebar side"><div class="sec"><h3>From your timeline</h3>${related || '<div class="empty">Nothing else exists yet…</div>'}</div></div>
    </div>
  </div>`;
}

function footer(){
  if (S.page === "setup" || S.page === "join") return "";
  return `<div id="ftr"><div class="wrap">
    Rewound is a time-machine viewer: data refreshed weekly from the YouTube Data API, playback via YouTube's official embedded player, nothing rehosted.
    View/subscriber figures shown with ≈ are estimates simulated for the displayed date. Deleted videos appear as unavailable.
    Comments are written by Rewound travelers, stamped with their simulated date — report anything off. Not affiliated with YouTube.
  </div></div>`;
}

function renderInto(){
  const fn = { setup: setupPage, join: joinPage, home: homePage, channel: channelPage, watch: watchPage }[S.page];
  document.getElementById("content").innerHTML = fn();
  if (S.page === "setup") updateSelCount();
  if (S.page === "watch" && S.watchId) hydrateComments(S.watchId);
  if (S.page === "home" && S.anchor && S.anchor.groupId) fillGroupCount();
}
function render(){
  document.getElementById("app").innerHTML = header() + timebar() + `<div id="content"></div>` + footer();
  renderInto();
  const q = document.getElementById("q");
  if (q && S.q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

boot();
</script>
</body>
</html>
